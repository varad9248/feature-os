apiVersion: apps/v1
kind: Deployment
metadata:
  name: featureos-ai-service
  namespace: feature-os
  labels:
    app: featureos-ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: featureos-ai-service
  template:
    metadata:
      labels:
        app: featureos-ai-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: ai-service
          image: ghcr.io/varad9248/feature-os-ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: featureos-ai-service
  namespace: feature-os
  labels:
    app: featureos-ai-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: featureos-ai-service
