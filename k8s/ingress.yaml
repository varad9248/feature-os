apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: featureos-ingress
  namespace: feature-os
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.featureos.io
        - api.featureos.io
      secretName: featureos-tls-cert
  rules:
    - host: app.featureos.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: featureos-web
                port:
                  number: 3000
    - host: api.featureos.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: featureos-api
                port:
                  number: 4000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: featureos-api
                port:
                  number: 4000
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: featureos-ai-service
                port:
                  number: 8000
